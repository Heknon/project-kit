# Called by an app repository's .github/workflows/deploy.yml (docs/contract.md).
#
# dev                → the dev environment: checks, migrations, deploy; the dev domain follows it.
# production branch  → full tests first, then migrations and a production deploy.
# Any other branch   → nothing.
#
# Migrations run before the new code is live, so they must be backward compatible with the
# version still serving.
#
# Bun apps (package.json) and Python apps (pyproject.toml + uv.lock) run the same steps; the
# Kit helpers step detects which. A Bun app with pyproject.toml and uv.lock gets Python too.
name: Deploy

on:
  workflow_call:
    inputs:
      production-branch:
        type: string
        default: main
      rotate:
        description: Generated variables the repository declares to replace with new values, comma separated
        type: string
        default: ""

jobs:
  full-tests:
    name: Full tests
    if: github.ref_name == inputs.production-branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Kit helpers
        run: |
          # Identical in every job of preview.yml and deploy.yml (cli/workflows.test.ts checks).
          cat > "$RUNNER_TEMP/kit.sh" <<'SH'
          # Prints the app's language for $GITHUB_ENV: bun (package.json) or python (pyproject.toml
          # and uv.lock); nothing when the branch has neither. A Bun app with pyproject.toml and
          # uv.lock also gets KIT_PYTHON: Python is set up for it too. docs/contract.md.
          kit_detect() {
            if [ -f package.json ]; then
              echo "KIT_LANG=bun"
            elif [ -f pyproject.toml ] && [ -f uv.lock ]; then
              echo "KIT_LANG=python"
            fi
            if [ -f pyproject.toml ] && [ -f uv.lock ]; then
              local version
              version=$(kit_python_version) || return 1
              echo "KIT_PYTHON=$version"
              echo "UV_PYTHON=$version"
              # Outside the checkout, so vercel build never bundles it.
              echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/venv"
            elif [ -f pyproject.toml ]; then
              echo "::error::pyproject.toml has no uv.lock. Run uv lock and commit uv.lock." >&2
              return 1
            fi
          }
          # .python-version, else the lower bound of requires-python. Vercel runs 3.12 and later.
          kit_python_version() {
            python3 -I - <<'PY'
          import pathlib, re, sys, tomllib
          pin = pathlib.Path(".python-version")
          if pin.exists():
              source, text = ".python-version", pin.read_text()
          else:
              project = tomllib.loads(pathlib.Path("pyproject.toml").read_text()).get("project", {})
              source, text = "requires-python", re.sub(r"^.*?(>=|==|~=)", "", project.get("requires-python", ""))
          match = re.match(r"\s*(\d+)\.(\d+)", text)
          if not match:
              sys.exit(f'::error::No Python version in {source}. Set requires-python = ">=3.12" in pyproject.toml, or add .python-version.')
          if (int(match[1]), int(match[2])) < (3, 12):
              sys.exit(f"::error::{source} asks for Python {match[1]}.{match[2]}; Vercel runs 3.12 and later. Raise it.")
          print(f"{match[1]}.{match[2]}")
          PY
          }
          # Python scripts are shell commands in [tool.project-kit.scripts] of pyproject.toml.
          kit_python_script() {
            python3 -I -c 'import sys, tomllib; s = tomllib.load(open("pyproject.toml", "rb")).get("tool", {}).get("project-kit", {}).get("scripts", {}).get(sys.argv[1]); print(s) if isinstance(s, str) and s.strip() else sys.exit(1)' "$1"
          }
          # Where a script is declared: python ([tool.project-kit.scripts], first when the app has
          # Python), bun (package.json), or nothing.
          kit_script_source() {
            if [ -n "$KIT_PYTHON" ] && kit_python_script "$1" > /dev/null; then
              echo python
            elif [ "$KIT_LANG" = bun ] && bun -e 'const s = (await Bun.file("package.json").json()).scripts ?? {}; process.exit(s[process.argv[1]] ? 0 : 1)' "$1"; then
              echo bun
            fi
          }
          has_script() {
            [ -n "$(kit_script_source "$1")" ]
          }
          # Runs a script that exists; a Python one inside the project's uv environment.
          kit_run() {
            if [ "$(kit_script_source "$1")" = python ]; then
              local command
              command=$(kit_python_script "$1")
              uv run --frozen -- bash -c "$command"
            else
              bun run "$1"
            fi
          }
          run_script() {
            local manifest=package.json
            [ "$KIT_LANG" = python ] && manifest="[tool.project-kit.scripts] of pyproject.toml"
            [ "$KIT_LANG" = bun ] && [ -n "$KIT_PYTHON" ] && manifest="package.json or [tool.project-kit.scripts] of pyproject.toml"
            if has_script "$1"; then kit_run "$1"; else echo "::notice::No $1 script in $manifest; skipped."; fi
          }
          vercel() {
            local log="$RUNNER_TEMP/vercel.log"
            if ! bunx vercel@65.2.0 "$@" --token="$VERCEL_TOKEN" 2> "$log"; then cat "$log" >&2; return 1; fi
          }
          neon() {
            bunx neonctl@2 "$@" --project-id "$NEON_PROJECT_ID"
          }
          SH
          source "$RUNNER_TEMP/kit.sh"
          kit_detect > "$RUNNER_TEMP/app.env"
          cat "$RUNNER_TEMP/app.env" >> "$GITHUB_ENV"
          set -a && source "$RUNNER_TEMP/app.env" && set +a

      - uses: oven-sh/setup-bun@v2
        if: env.KIT_LANG == 'bun'
        with:
          bun-version-file: package.json

      - uses: actions/cache@v4
        if: env.KIT_LANG == 'bun'
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # A Python app gets Bun too: it runs the Vercel and Neon CLIs.
      - uses: oven-sh/setup-bun@v2
        if: env.KIT_LANG == 'python'
        with:
          bun-version: 1.4.4

      - uses: actions/setup-python@v7
        if: env.KIT_PYTHON != ''
        with:
          python-version: ${{ env.KIT_PYTHON }}

      # uv's version: [tool.uv] required-version in pyproject.toml when the app sets it.
      - uses: astral-sh/setup-uv@v10.3.3
        if: env.KIT_PYTHON != ''
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install
        if: env.KIT_LANG != ''
        run: |
          if [ -n "$KIT_PYTHON" ]; then uv sync --frozen; fi
          if [ "$KIT_LANG" = bun ]; then bun install --frozen-lockfile; fi

      - name: Checks and full tests
        if: env.KIT_LANG != ''
        run: |
          source "$RUNNER_TEMP/kit.sh"
          run_script check
          run_script test:full

  deploy:
    name: Deploy ${{ github.ref_name == inputs.production-branch && 'production' || 'dev' }}
    needs: full-tests
    # Runs when the full tests passed, or were skipped because this is dev.
    if: >-
      !cancelled() && !failure()
      && (github.ref_name == 'dev' || github.ref_name == inputs.production-branch)
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == inputs.production-branch && 'production' || 'dev' }}
      url: ${{ github.event.repository.private && steps.deploy.outputs.url || '' }}
    concurrency:
      group: deploy-${{ github.repository }}-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      APP_ENV: ${{ github.ref_name == inputs.production-branch && 'production' || 'dev' }}
      PRIVATE_REPO: ${{ github.event.repository.private }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TEAM_SLUG: ${{ secrets.VERCEL_TEAM_SLUG }}
      DEV_DOMAIN: ${{ secrets.DEV_DOMAIN }}
      AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - name: Mask account names
        run: |
          if [ -n "$VERCEL_TEAM_SLUG" ]; then echo "::add-mask::$VERCEL_TEAM_SLUG"; fi
          if [ -n "$DEV_DOMAIN" ] && [ "$PRIVATE_REPO" != "true" ]; then echo "::add-mask::$DEV_DOMAIN"; fi

      - uses: actions/checkout@v4

      - name: Kit helpers
        run: |
          # Identical in every job of preview.yml and deploy.yml (cli/workflows.test.ts checks).
          cat > "$RUNNER_TEMP/kit.sh" <<'SH'
          # Prints the app's language for $GITHUB_ENV: bun (package.json) or python (pyproject.toml
          # and uv.lock); nothing when the branch has neither. A Bun app with pyproject.toml and
          # uv.lock also gets KIT_PYTHON: Python is set up for it too. docs/contract.md.
          kit_detect() {
            if [ -f package.json ]; then
              echo "KIT_LANG=bun"
            elif [ -f pyproject.toml ] && [ -f uv.lock ]; then
              echo "KIT_LANG=python"
            fi
            if [ -f pyproject.toml ] && [ -f uv.lock ]; then
              local version
              version=$(kit_python_version) || return 1
              echo "KIT_PYTHON=$version"
              echo "UV_PYTHON=$version"
              # Outside the checkout, so vercel build never bundles it.
              echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/venv"
            elif [ -f pyproject.toml ]; then
              echo "::error::pyproject.toml has no uv.lock. Run uv lock and commit uv.lock." >&2
              return 1
            fi
          }
          # .python-version, else the lower bound of requires-python. Vercel runs 3.12 and later.
          kit_python_version() {
            python3 -I - <<'PY'
          import pathlib, re, sys, tomllib
          pin = pathlib.Path(".python-version")
          if pin.exists():
              source, text = ".python-version", pin.read_text()
          else:
              project = tomllib.loads(pathlib.Path("pyproject.toml").read_text()).get("project", {})
              source, text = "requires-python", re.sub(r"^.*?(>=|==|~=)", "", project.get("requires-python", ""))
          match = re.match(r"\s*(\d+)\.(\d+)", text)
          if not match:
              sys.exit(f'::error::No Python version in {source}. Set requires-python = ">=3.12" in pyproject.toml, or add .python-version.')
          if (int(match[1]), int(match[2])) < (3, 12):
              sys.exit(f"::error::{source} asks for Python {match[1]}.{match[2]}; Vercel runs 3.12 and later. Raise it.")
          print(f"{match[1]}.{match[2]}")
          PY
          }
          # Python scripts are shell commands in [tool.project-kit.scripts] of pyproject.toml.
          kit_python_script() {
            python3 -I -c 'import sys, tomllib; s = tomllib.load(open("pyproject.toml", "rb")).get("tool", {}).get("project-kit", {}).get("scripts", {}).get(sys.argv[1]); print(s) if isinstance(s, str) and s.strip() else sys.exit(1)' "$1"
          }
          # Where a script is declared: python ([tool.project-kit.scripts], first when the app has
          # Python), bun (package.json), or nothing.
          kit_script_source() {
            if [ -n "$KIT_PYTHON" ] && kit_python_script "$1" > /dev/null; then
              echo python
            elif [ "$KIT_LANG" = bun ] && bun -e 'const s = (await Bun.file("package.json").json()).scripts ?? {}; process.exit(s[process.argv[1]] ? 0 : 1)' "$1"; then
              echo bun
            fi
          }
          has_script() {
            [ -n "$(kit_script_source "$1")" ]
          }
          # Runs a script that exists; a Python one inside the project's uv environment.
          kit_run() {
            if [ "$(kit_script_source "$1")" = python ]; then
              local command
              command=$(kit_python_script "$1")
              uv run --frozen -- bash -c "$command"
            else
              bun run "$1"
            fi
          }
          run_script() {
            local manifest=package.json
            [ "$KIT_LANG" = python ] && manifest="[tool.project-kit.scripts] of pyproject.toml"
            [ "$KIT_LANG" = bun ] && [ -n "$KIT_PYTHON" ] && manifest="package.json or [tool.project-kit.scripts] of pyproject.toml"
            if has_script "$1"; then kit_run "$1"; else echo "::notice::No $1 script in $manifest; skipped."; fi
          }
          vercel() {
            local log="$RUNNER_TEMP/vercel.log"
            if ! bunx vercel@65.2.0 "$@" --token="$VERCEL_TOKEN" 2> "$log"; then cat "$log" >&2; return 1; fi
          }
          neon() {
            bunx neonctl@2 "$@" --project-id "$NEON_PROJECT_ID"
          }
          SH
          source "$RUNNER_TEMP/kit.sh"
          kit_detect > "$RUNNER_TEMP/app.env"
          cat "$RUNNER_TEMP/app.env" >> "$GITHUB_ENV"
          set -a && source "$RUNNER_TEMP/app.env" && set +a
          if [ -z "$KIT_LANG" ]; then
            echo "::notice::No package.json or pyproject.toml on this branch; nothing to deploy."
          elif [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::The $APP_ENV environment has no Vercel secrets. Run kit apply for this project."
            exit 1
          else
            echo "KIT_APP=true" >> "$GITHUB_ENV"
          fi

      - uses: oven-sh/setup-bun@v2
        if: env.KIT_LANG == 'bun'
        with:
          bun-version-file: package.json

      - uses: actions/cache@v4
        if: env.KIT_LANG == 'bun'
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # A Python app gets Bun too: it runs the Vercel and Neon CLIs.
      - uses: oven-sh/setup-bun@v2
        if: env.KIT_LANG == 'python'
        with:
          bun-version: 1.4.4

      - uses: actions/setup-python@v7
        if: env.KIT_PYTHON != ''
        with:
          python-version: ${{ env.KIT_PYTHON }}

      # uv's version: [tool.uv] required-version in pyproject.toml when the app sets it.
      - uses: astral-sh/setup-uv@v10.3.3
        if: env.KIT_PYTHON != ''
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install
        if: env.KIT_LANG != ''
        run: |
          if [ -n "$KIT_PYTHON" ]; then uv sync --frozen; fi
          if [ "$KIT_LANG" = bun ]; then bun install --frozen-lockfile; fi

      # Production ran them in Full tests.
      - name: Checks
        if: env.KIT_APP == 'true' && env.APP_ENV == 'dev'
        run: |
          source "$RUNNER_TEMP/kit.sh"
          run_script check

      # Variables the repository declares (docs/contract.md), set before anything reads them.
      - name: Repository variables
        id: repo-env
        if: env.KIT_APP == 'true'
        run: |
          # A copy of cli/repo-env.ts (cli/workflows.test.ts checks; bun scripts/embed-repo-env.ts refreshes).
          cat > "$RUNNER_TEMP/repo-env.ts" <<'TS'
          /**
           * Variables an app repository declares for itself (docs/contract.md, "Variables the repository
           * declares"): the Deploy and Preview workflows put them on Vercel before they build. The
           * workflows run a copy of this file, so it imports nothing; cli/workflows.test.ts checks the
           * copies match, and `bun scripts/embed-repo-env.ts` refreshes them.
           */

          /** Names the kit sets itself (docs/contract.md); a project's own values may not reuse them. */
          export const CONTRACT_NAMES = new Set([
            "APP_ENV",
            "APP_URL",
            "CRON_SECRET",
            "DATABASE_URL",
            "DATABASE_URL_UNPOOLED",
            "S3_BUCKET",
            "S3_REGION",
            "S3_PREFIX",
            "S3_ROLE_ARN",
            "AUTH_SECRET",
            "AUTH_URL",
            "AUTH_REDIRECT_PROXY_URL",
            "AUTH_GOOGLE_ID",
            "AUTH_GOOGLE_SECRET",
          ]);

          /** GitHub secrets the kit's workflows read: a declaration must not hand them to the app. */
          const WORKFLOW_NAMES = new Set(["DEV_DOMAIN", "AWS_DEPLOY_ROLE_ARN", "AWS_REGION"]);
          const WORKFLOW_PREFIXES = ["VERCEL_", "NEON_", "GITHUB_", "ACTIONS_", "RUNNER_"];

          export const REPO_SCOPES = ["production", "dev", "preview"] as const;
          export type RepoScope = (typeof REPO_SCOPES)[number];

          export interface RepoVariable {
            name: string;
            scopes: RepoScope[];
            /** A random value, created once per scope when the variable is missing. */
            generate: boolean;
            /** false: the value may come from a GitHub Actions variable and is stored readable. */
            sensitive: boolean;
            /** A value from GitHub that may be missing; the variable is then left out. */
            optional: boolean;
          }

          export interface Declaration {
            /** Where it was declared, for messages. */
            source: string;
            variables: RepoVariable[];
          }

          /** A problem with the declaration or with Vercel, said in one line per problem. */
          export class RepoEnvError extends Error {}

          const KEYS = new Set(["scopes", "generate", "sensitive", "optional"]);
          const PYPROJECT = "[tool.project-kit.env] of pyproject.toml";
          const PACKAGE_JSON = '"project-kit".env of package.json';

          /**
           * The declaration in an app's files: `[tool.project-kit.env]` of pyproject.toml, or
           * `"project-kit": { "env": … }` of package.json. Null when neither declares one.
           */
          export function readDeclaration(files: { pyproject?: string | null; packageJson?: string | null }): Declaration | null {
            const found: { source: string; table: unknown }[] = [];
            if (files.pyproject) {
              let parsed: unknown;
              try {
                parsed = Bun.TOML.parse(files.pyproject);
              } catch (error) {
                throw new RepoEnvError(`pyproject.toml isn't valid TOML: ${(error as Error).message}`);
              }
              const table = field(field(field(parsed, "tool"), "project-kit"), "env");
              if (table !== undefined) found.push({ source: PYPROJECT, table });
            }
            if (files.packageJson) {
              let parsed: unknown;
              try {
                parsed = JSON.parse(files.packageJson);
              } catch (error) {
                throw new RepoEnvError(`package.json isn't valid JSON: ${(error as Error).message}`);
              }
              const table = field(field(parsed, "project-kit"), "env");
              if (table !== undefined) found.push({ source: PACKAGE_JSON, table });
            }
            if (found.length > 1) throw new RepoEnvError(`Declare the variables in one place: ${PYPROJECT} or ${PACKAGE_JSON}, not both.`);
            const [one] = found;
            return one ? { source: one.source, variables: parseVariables(one.source, one.table) } : null;
          }

          function field(value: unknown, key: string): unknown {
            return value !== null && typeof value === "object" && !Array.isArray(value) ? (value as Record<string, unknown>)[key] : undefined;
          }

          function isTable(value: unknown): value is Record<string, unknown> {
            return value !== null && typeof value === "object" && !Array.isArray(value);
          }

          export function parseVariables(source: string, table: unknown): RepoVariable[] {
            if (!isTable(table)) throw new RepoEnvError(`${source} is a table of variable names.`);
            const problems: string[] = [];
            const variables: RepoVariable[] = [];
            for (const [name, entry] of Object.entries(table)) {
              const problem = (message: string) => problems.push(`${source}: ${name}: ${message}`);
              if (!/^[A-Z][A-Z0-9_]*$/.test(name)) {
                problem("names are upper case letters, digits and underscores");
                continue;
              }
              if (CONTRACT_NAMES.has(name)) {
                problem("this name is set by the kit (docs/contract.md)");
                continue;
              }
              if (WORKFLOW_NAMES.has(name) || WORKFLOW_PREFIXES.some((prefix) => name.startsWith(prefix))) {
                problem("this name is reserved for the kit's workflows; pick another");
                continue;
              }
              if (!isTable(entry)) {
                problem('give a table, for example { scopes = ["production"], generate = true }');
                continue;
              }
              const unknown = Object.keys(entry).filter((key) => !KEYS.has(key));
              if (unknown.length > 0) {
                problem(`unknown ${unknown.join(", ")}; the fields are ${[...KEYS].join(", ")}`);
                continue;
              }
              const { scopes, generate = false, sensitive = true, optional = false } = entry;
              if (!Array.isArray(scopes) || scopes.length === 0 || !scopes.every((s) => REPO_SCOPES.includes(s as RepoScope))) {
                problem(`scopes is a list of ${REPO_SCOPES.join(", ")}`);
                continue;
              }
              if (new Set(scopes).size !== scopes.length) {
                problem("scopes lists a scope twice");
                continue;
              }
              if (typeof generate !== "boolean" || typeof sensitive !== "boolean" || typeof optional !== "boolean") {
                problem("generate, sensitive and optional are true or false");
                continue;
              }
              if (generate && !sensitive) {
                problem("a generated value is always sensitive; drop sensitive = false");
                continue;
              }
              if (generate && optional) {
                problem("optional is for values from GitHub; a generated value is never missing");
                continue;
              }
              variables.push({ name, scopes: scopes as RepoScope[], generate, sensitive, optional });
            }
            if (problems.length > 0) throw new RepoEnvError(problems.join("\n"));
            return variables;
          }

          /** Where a scope's values live on Vercel. */
          export function vercelTarget(scope: RepoScope): { target: "production" | "preview"; gitBranch?: string } {
            if (scope === "production") return { target: "production" };
            if (scope === "dev") return { target: "preview", gitBranch: "dev" };
            return { target: "preview" };
          }

          export interface ExistingEnv {
            key: string;
            target?: string[];
            gitBranch?: string | null;
          }

          export interface EnvWrite {
            key: string;
            value: string;
            type: "sensitive" | "encrypted";
            target: "production" | "preview";
            gitBranch?: string;
            /** Where the value came from, for the log. */
            from: string;
          }

          export interface Plan {
            writes: EnvWrite[];
            /** Lines for the log; never values. */
            notes: string[];
            errors: string[];
          }

          /** The names `rotate` lists: comma or space separated. */
          export function parseRotate(input: string | undefined): string[] {
            return [...new Set((input ?? "").split(/[\s,]+/).filter(Boolean))];
          }

          /**
           * What one scope's run writes: generated values only when missing (or named in `rotate`), and
           * values from GitHub every time, so GitHub stays the source of truth.
           */
          export function planScope(options: {
            declaration: Declaration;
            scope: RepoScope;
            existing: ExistingEnv[];
            secrets: Record<string, unknown>;
            vars: Record<string, unknown>;
            rotate: string[];
            random: () => string;
          }): Plan {
            const { declaration, scope, existing, secrets, vars, rotate, random } = options;
            const plan: Plan = { writes: [], notes: [], errors: [] };
            const where = vercelTarget(scope);
            const present = (key: string) =>
              existing.some(
                (env) => env.key === key && env.target?.includes(where.target) && (where.gitBranch ? env.gitBranch === where.gitBranch : !env.gitBranch),
              );

            for (const name of rotate) {
              const variable = declaration.variables.find((v) => v.name === name);
              if (!variable?.generate) plan.errors.push(`rotate names ${name}, which ${declaration.source} doesn't declare with generate = true.`);
              else if (!variable.scopes.includes(scope)) plan.notes.push(`${name} isn't in the ${scope} scope; not rotated here.`);
            }

            for (const variable of declaration.variables.filter((v) => v.scopes.includes(scope))) {
              const { name } = variable;
              const base = { key: name, target: where.target, gitBranch: where.gitBranch };
              if (variable.generate) {
                if (rotate.includes(name)) plan.writes.push({ ...base, value: random(), type: "sensitive", from: "a new random value (rotate)" });
                else if (present(name)) plan.notes.push(`${name} (${scope}): kept.`);
                else plan.writes.push({ ...base, value: random(), type: "sensitive", from: "a new random value" });
                continue;
              }
              const secret = text(secrets[name]);
              const variableValue = variable.sensitive ? null : text(vars[name]);
              if (secret !== null) {
                plan.writes.push({ ...base, value: secret, type: variable.sensitive ? "sensitive" : "encrypted", from: "the GitHub secret" });
              } else if (variableValue !== null) {
                plan.writes.push({ ...base, value: variableValue, type: "encrypted", from: "the GitHub variable" });
              } else if (variable.optional) {
                plan.notes.push(`${name} (${scope}): no value in GitHub; left out.`);
              } else {
                const kinds = variable.sensitive ? "secret" : "secret or variable";
                plan.errors.push(`${name} has no value for ${scope}: add a GitHub ${kinds} ${name} to the ${scope} environment or the repository, or mark it optional = true.`);
              }
            }
            return plan;
          }

          function text(value: unknown): string | null {
            return typeof value === "string" && value !== "" ? value : null;
          }

          /** 32 random bytes, hex. */
          export function randomHex(): string {
            const bytes = crypto.getRandomValues(new Uint8Array(32));
            return Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join("");
          }

          export interface SyncOptions {
            cwd: string;
            env: Record<string, string | undefined>;
            fetch: (url: string, init: { method: string; headers: Record<string, string>; body?: string }) => Promise<Response>;
            print: (line: string) => void;
            /** Errors and masks: stderr, so they still reach the runner when stdout goes to $GITHUB_OUTPUT. */
            printError: (line: string) => void;
            random?: () => string;
          }

          async function readFile(path: string): Promise<string | null> {
            const file = Bun.file(path);
            return (await file.exists()) ? await file.text() : null;
          }

          /**
           * The workflow step. `--check` prints `declared=true` (and `vars=true` when a value may come
           * from a GitHub variable) for $GITHUB_OUTPUT; otherwise it writes the scope APP_ENV names.
           * Returns the exit code.
           */
          export async function syncRepoEnv(args: string[], options: SyncOptions): Promise<number> {
            const { env, print, printError } = options;
            const fail = (message: string) => {
              for (const line of message.split("\n")) printError(`::error::${line}`);
              return 1;
            };

            let declaration: Declaration | null;
            try {
              declaration = readDeclaration({
                pyproject: await readFile(`${options.cwd}/pyproject.toml`),
                packageJson: await readFile(`${options.cwd}/package.json`),
              });
            } catch (error) {
              if (error instanceof RepoEnvError) return fail(error.message);
              throw error;
            }

            if (args.includes("--check")) {
              if (declaration && declaration.variables.length > 0) {
                print("declared=true");
                if (declaration.variables.some((v) => !v.sensitive)) print("vars=true");
              }
              return 0;
            }
            if (!declaration || declaration.variables.length === 0) return 0;

            const scope = env.APP_ENV as RepoScope;
            if (!REPO_SCOPES.includes(scope)) return fail(`APP_ENV is ${scope ?? "unset"}; expected one of ${REPO_SCOPES.join(", ")}.`);
            const { VERCEL_TOKEN: token, VERCEL_PROJECT_ID: projectId, VERCEL_ORG_ID: orgId } = env;
            if (!token || !projectId) return fail(`The ${scope} environment has no Vercel secrets. Run kit apply for this project.`);

            const query = orgId?.startsWith("team_") ? `teamId=${encodeURIComponent(orgId)}` : "";
            const api = async (method: string, path: string, body?: unknown): Promise<unknown> => {
              const url = `https://api.vercel.com${path}${query ? `${path.includes("?") ? "&" : "?"}${query}` : ""}`;
              const response = await options.fetch(url, {
                method,
                headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
                body: body === undefined ? undefined : JSON.stringify(body),
              });
              if (!response.ok) {
                const detail = (await response.json().catch(() => ({}))) as { error?: { message?: string } };
                throw new RepoEnvError(`Vercel ${method} ${path.split("?")[0]} failed (${response.status}): ${detail.error?.message ?? response.statusText}`);
              }
              return response.json();
            };

            const project = `/v10/projects/${encodeURIComponent(projectId)}/env`;
            try {
              const { envs } = (await api("GET", project)) as { envs: ExistingEnv[] };
              const plan = planScope({
                declaration,
                scope,
                existing: envs,
                secrets: JSON.parse(env.KIT_SECRETS || "{}") as Record<string, unknown>,
                vars: JSON.parse(env.KIT_VARS || "{}") as Record<string, unknown>,
                rotate: parseRotate(env.KIT_ROTATE),
                random: options.random ?? randomHex,
              });
              for (const write of plan.writes) {
                if (write.from === "the GitHub variable") continue;
                for (const line of write.value.split(/\r?\n/)) if (line) printError(`::add-mask::${line}`);
              }
              if (plan.errors.length > 0) return fail(plan.errors.join("\n"));
              for (const note of plan.notes) print(note);
              for (const { key, value, type, target, gitBranch, from } of plan.writes) {
                await api("POST", `${project}?upsert=true`, { key, value, type, target: [target], gitBranch });
                print(`${key} (${scope}): set from ${from}.`);
              }
              return 0;
            } catch (error) {
              if (error instanceof RepoEnvError) return fail(error.message);
              throw error;
            }
          }

          if (import.meta.main) {
            process.exitCode = await syncRepoEnv(Bun.argv.slice(2), {
              cwd: process.cwd(),
              env: process.env,
              fetch: (url, init) => fetch(url, init),
              print: (line) => console.log(line),
              printError: (line) => console.error(line),
            });
          }
          TS
          bun "$RUNNER_TEMP/repo-env.ts" --check >> "$GITHUB_OUTPUT"

      # Secrets only when the repository declares variables; GitHub variables (printed in this
      # log) only when one of them may come from a variable.
      - name: Write repository variables
        if: steps.repo-env.outputs.declared == 'true'
        env:
          KIT_ROTATE: ${{ inputs.rotate }}
          KIT_SECRETS: ${{ toJSON(secrets) }}
          KIT_VARS: ${{ steps.repo-env.outputs.vars == 'true' && toJSON(vars) || '{}' }}
        run: bun "$RUNNER_TEMP/repo-env.ts"

      - name: Migrate
        if: env.KIT_APP == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          source "$RUNNER_TEMP/kit.sh"
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then echo "::notice::No database for $APP_ENV; migrations skipped."; exit 0; fi
          run_script db:migrate:deploy

      - name: Before deploy
        if: env.KIT_APP == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          source "$RUNNER_TEMP/kit.sh"
          run_script kit:pre-deploy

      - uses: aws-actions/configure-aws-credentials@v4
        if: env.KIT_APP == 'true' && env.AWS_DEPLOY_ROLE_ARN != ''
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: true

      - name: AWS infrastructure
        if: env.KIT_APP == 'true' && env.AWS_DEPLOY_ROLE_ARN != ''
        run: |
          source "$RUNNER_TEMP/kit.sh"
          run_script kit:deploy-aws

      - name: Deploy
        id: deploy
        if: env.KIT_APP == 'true'
        run: |
          source "$RUNNER_TEMP/kit.sh"
          # Vercel's Python builder picks the version and installs the dependencies itself, as on Vercel.
          unset UV_PROJECT_ENVIRONMENT UV_PYTHON
          if [ "$APP_ENV" = production ]; then
            vercel pull --yes --environment=production > /dev/null
            vercel build --prod > "$RUNNER_TEMP/build.log" 2>&1 || { cat "$RUNNER_TEMP/build.log"; exit 1; }
            url=$(vercel deploy --prebuilt --prod)
          else
            # Preview-scoped values, narrowed to the dev branch where it sets its own. The dev
            # domain is assigned to the dev branch, so this deployment takes it over.
            vercel pull --yes --environment=preview --git-branch=dev > /dev/null
            vercel build > "$RUNNER_TEMP/build.log" 2>&1 || { cat "$RUNNER_TEMP/build.log"; exit 1; }
            vercel deploy --prebuilt > /dev/null
            url="https://$DEV_DOMAIN"
          fi
          if [ "$PRIVATE_REPO" != "true" ]; then echo "::add-mask::$url"; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          rm -f .vercel/.env.*

      - name: After deploy
        if: env.KIT_APP == 'true'
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          source "$RUNNER_TEMP/kit.sh"
          run_script kit:post-deploy
