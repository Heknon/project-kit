services:
  postgres:
    image: postgres:18.7
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql

  s3:
    image: chrislusf/seaweedfs:4.54
    command: mini -dir=/data -bucket=app -admin.ui=false
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: localsecret
    ports:
      - "8333:8333"
    volumes:
      - s3:/data

volumes:
  postgres:
  s3:
